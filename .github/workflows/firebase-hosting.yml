name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 👇 Bước deploy tách riêng, dùng secret token
      - name: Deploy to Firebase Hosting
        run: |
          npx firebase deploy --only hosting:womenchats --project projectchat3-b0aa1 --token "${{ secrets.FIREBASE_TOKEN }}"
